  /* ---------- Design tokens ----------
     A warm palette: a deep teal field lit warmly by sand — edit these
     like a name handed across a dim room. Sand is spent only on the things
     you actually tap. Everything else stays quiet. */
  :root{
    --ink:        #10131d;   /* charcoal base */
    --teal:       #3F7F7A;   /* oxidized teal */
    --teal-2:     #4c918a;   /* lit teal for glow */
    --line:       rgba(176, 141, 87, 0.26);
    --line-soft:  rgba(176, 141, 87, 0.15);
    --sand:       #C79A5B;   /* antique brass — tap accent */
    --sand-deep:  #9c7740;
    --cream:      #E9DFCB;   /* warm cream */
    --cream-dim:  rgba(233, 223, 203, 0.66);
    --r:          16px;

    --serif: "Cinzel", Georgia, "Times New Roman", serif;
    --body:  "EB Garamond", Georgia, "Iowan Old Style", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    min-height:100svh;
    font-family:var(--sans);
    color:var(--cream);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--teal-2) 0%, var(--teal) 38%, var(--ink) 78%) fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    justify-content:center;
    padding:
      max(20px, env(safe-area-inset-top))
      18px
      max(28px, env(safe-area-inset-bottom));
  }

  .card{
    width:100%;
    max-width:420px;
    align-self:center;
    position:relative;
    padding:38px 26px 26px;
    border-radius:24px;
    /* engraved business-card edge */
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 40%);
    border:1px solid var(--line);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 30px 70px -30px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  @media (max-width:412px){ .card{ padding-left:16px; padding-right:16px; } #name{ font-size:clamp(24px, 7.5vw, 33px); } #role{ font-size:clamp(15.5px, 4.9vw, 21.5px); } }
  /* warm spotlight behind the name — the one bold move */
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(60% 38% at 50% 14%, rgba(255,215,180,0.15), transparent 70%);
    pointer-events:none;
    transform-origin:50% 15%;
    will-change:transform, opacity;
  }
  @keyframes glow{
    from { transform:scale(1);    opacity:.80; }
    to   { transform:scale(1.10); opacity:1; }
  }

  /* ---------- Header ---------- */
  .eyebrow{
    position:relative;
    text-align:center;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--sand);
    opacity:0.85;
    margin:0 0 18px;
  }
  /* ---------- Moving portrait (optional) ---------- */
  .portrait{
    position:relative;
    margin:-38px -26px 20px;          /* full-bleed to the card edges */
    aspect-ratio:4 / 5;
    overflow:hidden;
    background:#0a201f;
  }
  .portrait[hidden]{ display:none; }
  .portrait img, .portrait video{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .portrait::after{                    /* seat the image into the card */
    content:""; position:absolute; left:0; right:0; bottom:0; height:40%;
    background:linear-gradient(180deg, transparent 55%, rgba(8,33,31,0.45));
    pointer-events:none;
  }

  .monogram{
    position:relative;
    width:60px; height:60px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid; place-items:center;
    border:1px solid var(--line);
    background:radial-gradient(120% 120% at 30% 20%, rgba(255,215,180,0.14), rgba(255,215,180,0.02));
    font-family:var(--serif);
    font-size:24px;
    color:var(--sand);
    letter-spacing:0.02em;
  }
  h1{
    position:relative;
    font-family:var(--serif);
    font-weight:400;
    font-size:34px;
    line-height:1.06;
    text-align:center;
    width:fit-content;
    max-width:100%;
    margin:0 auto 11px;
    padding-bottom:9px;
    border-bottom:3px solid var(--sand);
    letter-spacing:-0.01em;
  }
  .role{
    position:relative;
    text-align:center;
    font-size:22px;
    line-height:1.4;
    color:var(--cream-dim);
    margin:0 auto 24px;
    max-width:40ch;
  }
  .role b{ color:var(--cream); font-weight:600; }
  .role-sub{ display:block; margin-top:5px; font-size:12px; letter-spacing:0.005em; color:var(--cream-dim); }
  .eyebrow[hidden]{ display:none; }

  .cred{
    position:relative;
    display:flex; justify-content:center;
    margin:-12px auto 22px;
  }
  .cred[hidden]{ display:none; }
  .cred span{
    display:inline-block; text-align:center;
    font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase;
    line-height:1.55;
    color:var(--sand);
    padding:7px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,215,180,0.05);
  }
  .cred span::before{
    content:""; display:inline-block; vertical-align:middle;
    width:5px; height:5px; border-radius:50%; margin-right:9px; position:relative; top:-1px;
    background:var(--sand);
    box-shadow:0 0 9px rgba(255,215,180,0.85);
  }

  /* ---------- Primary action ---------- */
  .save{
    position:relative;
    width:100%;
    border:0;
    cursor:pointer;
    font-family:var(--sans);
    font-size:15px;
    font-weight:650;
    letter-spacing:0.01em;
    color:#16302b;
    background:linear-gradient(180deg, var(--sand), var(--sand-deep));
    padding:16px 18px;
    border-radius:var(--r);
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 14px 30px -14px rgba(255,215,180,0.55);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .save:hover{ filter:brightness(1.03); }
  .save:active{ transform:translateY(1px) scale(0.995); }
  .save svg{ width:18px; height:18px; }

  /* ---------- Share / QR row ---------- */
  .actions{
    position:relative;
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin-top:8px;
  }
  .actions[hidden]{ display:none; }
  .actions button{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 10px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    font-family:var(--sans); font-size:13px; font-weight:600; letter-spacing:0.01em;
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .actions button:active{ transform:translateY(1px); }
  .actions button:hover{ background:rgba(255,215,180,0.07); }
  .actions svg{ width:17px; height:17px; color:var(--sand); }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(6,22,21,0.72);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:var(--cream); border-radius:22px;
    padding:22px 22px 18px; max-width:320px; width:100%;
    text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,0.7);
  }
  #qrModal .sheet h3{
    margin:0 0 4px; font-family:var(--serif); font-weight:400;
    font-size:20px; color:#123c3a;
  }
  #qrModal .sheet p{ margin:0 0 14px; font-size:12px; color:#4b6b68; word-break:break-all; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; border-radius:10px; }
  #qrModal .close{
    margin-top:14px; width:100%; border:0; border-radius:12px; cursor:pointer;
    padding:11px; font-family:var(--sans); font-size:13px; font-weight:650;
    color:var(--cream); background:var(--teal);
  }

  /* ---------- Quick row ---------- */
  .quick{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:8px;
  }
  .quick a{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:13px 6px;
    border-radius:13px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.025);
    color:var(--cream);
    text-decoration:none;
    font-size:11.5px;
    letter-spacing:0.02em;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .quick a:active{ transform:translateY(1px); }
  .quick a:hover{ background:rgba(255,215,180,0.07); border-color:var(--line); }
  .quick svg{ width:19px; height:19px; color:var(--sand); }

  /* ---------- Divider ---------- */
  .sep{
    position:relative;
    display:flex; align-items:center; gap:12px;
    margin:24px 2px 14px;
    color:var(--sand);
    font-size:10.5px; letter-spacing:0.26em; text-transform:uppercase; opacity:0.7;
  }
  .sep::before, .sep::after{
    content:""; height:1px; flex:1; background:var(--line-soft);
  }

  /* ---------- Socials ---------- */
  .socials{
    position:relative;
    display:flex; flex-direction:column; gap:8px;
  }
  .social{
    display:flex; align-items:center; gap:14px;
    padding:13px 15px;
    border-radius:13px;
    border:1px solid var(--line-soft);
    background:rgba(255,255,255,0.02);
    color:var(--cream);
    text-decoration:none;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .social:active{ transform:translateY(1px); }
  .social:hover{ background:rgba(255,215,180,0.06); border-color:var(--line); }
  .social .ic{ width:22px; height:22px; flex:none; color:var(--sand); display:grid; place-items:center; }
  .social .ic svg{ width:20px; height:20px; }
  .social .tx{ display:flex; flex-direction:column; line-height:1.25; }
  .social .tx .name{ font-size:14px; font-weight:600; }
  .social .tx .sub{ font-size:12px; color:var(--cream-dim); }
  .social .go{ margin-left:auto; color:var(--sand); opacity:0.55; }
  .social .go svg{ width:16px; height:16px; }

  /* ---------- Footer ---------- */
  footer{
    position:relative;
    margin-top:24px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
  }
  footer a{ color:var(--sand); text-decoration:none; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:#0a201f; color:var(--cream);
    border:1px solid var(--line);
    padding:12px 16px; border-radius:12px;
    font-size:13px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.7);
    opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion:no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .reveal:nth-child(1){ animation-delay:.02s }
    @keyframes rise{ to{ opacity:1; transform:none; } }
    .card::before{ animation:glow 14s ease-in-out infinite alternate; }
  }

  :focus-visible{ outline:2px solid var(--sand); outline-offset:3px; border-radius:8px; }

  /* ---- Glasshouse brand additions ---- */
  h1{ font-weight:600; letter-spacing:0.04em; }
  .role, .eyebrow, .cred span, .social .sub, footer{ font-family:var(--body); }
  .eyebrow{ font-family:var(--body); letter-spacing:0.34em; }
  .brandmark{ display:flex; flex-direction:column; align-items:center; gap:7px; margin:10px 0 2px; }
  .brandmark .lockup{ width:100%; height:auto; display:block; filter:drop-shadow(0 6px 16px rgba(0,0,0,.45)); }
  .brandmark .fline{ font-family:var(--body); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--cream-dim); }
  footer .sig{ display:block; width:190px; max-width:64%; height:auto; margin:2px auto 12px; opacity:.95; }
  footer .fline{ display:block; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--cream-dim); }
  #monogram[hidden]{ display:none !important; }
</style>
</head>
<body>
  <main class="card" id="card">

    <p class="role reveal" id="role"></p>
    <div class="cred reveal" id="cred" hidden></div>

    <button class="save reveal" id="saveBtn" type="button">

      <span id="saveLabel">Save my contact</span>
    </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        <span>Share</span>
      </button>
      <button id="qrBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
        <span>QR</span>
      </button>
    </div>

    <div class="quick reveal" id="quick"></div>

    <div class="sep reveal">Follow along</div>
    <nav class="socials reveal" id="socials" aria-label="Social profiles"></nav>

    <footer class="reveal" id="footer"></footer>

      <div class="qrbox" id="qrbox"></div>

    </div>
  </div>

      setupPositionProbePattern(_moduleCount - 7, 0);

        for (var c = -1; c <= 7; c += 1) {

      var pattern = 0;

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

        }

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

          + buffer.getLengthInBits()

        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {

        }
        buffer.put(PAD1, 8);

      case 'Alphanumeric' :

        break;
      case 'Byte' :

        break;
      case 'Kanji' :

        break;

      _dataCache = null;
    };

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

          }

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {

          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      var max = size - margin;

      return createDataURL(size, size, function(x, y) {

          var r = Math.floor( (y - min) / cellSize);

        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);

            p += '█';

          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

/* ---- Render ---- */
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

document.getElementById('monogram').textContent = CONFIG.initials || (CONFIG.firstName[0]+CONFIG.lastName[0]);
document.getElementById('name').textContent = CONFIG.fullName;
document.getElementById('role').innerHTML = CONFIG.roleHTML;
const eyebrowEl = document.querySelector('.eyebrow');
const eyebrowText = [CONFIG.location.city, CONFIG.location.country].filter(Boolean).join(' · ');
eyebrowEl.textContent = eyebrowText;
eyebrowEl.hidden = !eyebrowText;   // no location => no empty small-caps line above the name

// Quick row — resolves each key from a core field or the socials list
function resolveAction(key){
  if (key==='call'     && CONFIG.phone)    return {ic:'phone',    label:'Call',     href:'tel:'+CONFIG.phone.replace(/\s/g,'')};
  if (key==='whatsapp' && CONFIG.whatsapp) return {ic:'whatsapp', label:'WhatsApp', href:'https://wa.me/'+CONFIG.whatsapp};
  if (key==='email'    && CONFIG.email)    return {ic:'mail',     label:'Email',    href:'mailto:'+CONFIG.email};
  if (key==='website'  && CONFIG.website)  return {ic:'website',  label:'Website',  href:CONFIG.website};
  const s = CONFIG.socials.find(x => x.key===key && x.url && x.url.trim());
  return s ? {ic:s.key, label:s.name, href:s.url} : null;
}
const quick = (CONFIG.quickActions || []).map(resolveAction).filter(Boolean);
const quickEl = document.getElementById('quick');
// Columns follow the actual button count so the row always fills the width
// (2 actions => two half-width cards aligned under Share/QR; never a ragged empty column).
quickEl.style.gridTemplateColumns = 'repeat(' + Math.max(1, Math.min(quick.length, 3)) + ', 1fr)';
quickEl.innerHTML = quick.map(q =>
  `<a href="${esc(q.href)}">${ICONS[q.ic] || ICONS.globe}<span>${esc(q.label)}</span></a>`
).join('');

// Socials
document.getElementById('socials').innerHTML = CONFIG.socials
  .filter(s => s.url && s.url.trim() && !s.hideFromList)
  .map(s => `<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="ic">${ICONS[s.key] || ICONS.globe}</span>
      <span class="tx"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.sub||'')}</span></span>
      <span class="go">${ARROW}</span>
    </a>`).join('');

document.getElementById('footer').innerHTML = CONFIG.footerHTML || '';

const credEl = document.getElementById('cred');
if (CONFIG.credential && CONFIG.credential.trim()){
  credEl.innerHTML = `<span>${esc(CONFIG.credential)}</span>`;
  credEl.hidden = false;
} else {
  credEl.hidden = true;
}

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};;;`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${CONFIG.title}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L.country||''}`,
    ...CONFIG.socials.filter(s=>s.url && s.url.trim()).map(s=>`URL:${s.url}`),
    CONFIG.note ? `NOTE:${CONFIG.note}` : '',
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Contact card downloaded — open it to add me.');
  }catch(e){
    toast('Could not download. Try the call or email button instead.');
  }
});

/* ---- Moving portrait ---- */
(function(){
  const p = CONFIG.portrait || {};
  const el = document.getElementById('portrait');
  const src = p.video || p.image;
  if (!src) return;
  el.innerHTML = p.video
    ? `<video src="${esc(p.video)}"${p.poster ? ` poster="${esc(p.poster)}"` : ''} autoplay muted loop playsinline></video>`
    : `<img src="${esc(p.image)}" alt="${esc(CONFIG.fullName)}">`;
  el.hidden = false;
  document.getElementById('monogram').hidden = true;
})();

/* ---- Share + QR ---- */
(function(){
  const wrap = document.getElementById('actions');
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!CONFIG.showShare && !CONFIG.showQR){ wrap.hidden = true; return; }
  if (!!CONFIG.showShare !== !!CONFIG.showQR) wrap.style.gridTemplateColumns = '1fr';

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast('Link copied to clipboard.');
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const openQR = () => {
      document.getElementById('qrUrl').textContent = location.href;
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 12, scalable: true });
          svg = svg.replace(/fill="white"/g, 'fill="#EFE7D6"')
                   .replace(/fill="black"/g, 'fill="#234B47"');
          box.innerHTML = svg; box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = '<p>Could not render code.</p>'; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); };
    qrBtn.addEventListener('click', openQR);
    document.getElementById('qrClose').addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
  }
})();
</script>
